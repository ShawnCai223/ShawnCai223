<svg viewBox="0 0 900 210" width="900" height="210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titlebar" x1="0" x2="1">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff004c"/>
      <stop offset="0.17" stop-color="#ff9900"/>
      <stop offset="0.33" stop-color="#f2c500"/>
      <stop offset="0.5" stop-color="#22bb33"/>
      <stop offset="0.67" stop-color="#0099ff"/>
      <stop offset="0.83" stop-color="#9933ff"/>
      <stop offset="1" stop-color="#ff004c"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="typing">
      <rect x="96" y="44" width="0" height="20">
        <animate attributeName="width" values="0;270;270;0" keyTimes="0;0.35;0.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- window frame (Win98-ish bevel) -->
  <rect x="2" y="2" width="896" height="206" fill="#c0c0c0"/>
  <path d="M2,208 V2 H898" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M2,208 H898 V2" fill="none" stroke="#404040" stroke-width="2"/>

  <!-- title bar -->
  <rect x="6" y="6" width="888" height="26" fill="url(#titlebar)"/>
  <text x="16" y="24" font-family="Tahoma,Verdana,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🌐 Shawn's Homepage</text>
  <g font-family="Tahoma,Verdana,sans-serif" font-size="13" font-weight="bold" fill="#000">
    <rect x="818" y="10" width="20" height="18" fill="#c0c0c0" stroke="#404040"/><text x="824" y="23">_</text>
    <rect x="842" y="10" width="20" height="18" fill="#c0c0c0" stroke="#404040"/><rect x="847" y="14" width="10" height="9" fill="none" stroke="#000" stroke-width="1.5"/>
    <rect x="866" y="10" width="20" height="18" fill="#c0c0c0" stroke="#404040"/><text x="871" y="23">×</text>
  </g>

  <!-- address bar -->
  <text x="12" y="59" font-family="Tahoma,Verdana,sans-serif" font-size="13" fill="#000">Address</text>
  <rect x="70" y="42" width="820" height="24" fill="#ffffff" stroke="#404040"/>
  <text x="78" y="59" font-family="Tahoma,Verdana,sans-serif" font-size="13">🔗</text>
  <text x="98" y="59" font-family="'Courier New',Courier,monospace" font-size="15" fill="#000" clip-path="url(#typing)">github.com/ShawnCai223</text>

  <!-- page area -->
  <rect x="8" y="74" width="884" height="128" fill="#ffffff" stroke="#808080"/>
  <text x="450" y="160" text-anchor="middle"
        font-family="'Arial Black',Impact,'Helvetica Neue',sans-serif" font-weight="900"
        font-size="60" fill="url(#rainbow)" stroke="#1a1a6e" stroke-width="2" letter-spacing="2">
    Hi, I'm Shawn!
  </text>
  <text x="718" y="158" font-size="52" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👋<animateTransform attributeName="transform" type="rotate" values="0 763 150; 18 763 150; -8 763 150; 18 763 150; 0 763 150; 0 763 150" keyTimes="0;0.15;0.3;0.45;0.6;1" dur="2.5s" repeatCount="indefinite"/></text>
</svg>
