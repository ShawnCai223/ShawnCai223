<svg viewBox="0 0 110 100" width="110" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- spinning record -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 50 52" to="360 50 52" dur="3s" repeatCount="indefinite"/>
    <circle cx="50" cy="52" r="40" fill="#111" stroke="#666" stroke-width="1.5"/>
    <g fill="none" stroke="#333" stroke-width="1">
      <circle cx="50" cy="52" r="34"/><circle cx="50" cy="52" r="28"/><circle cx="50" cy="52" r="22"/>
    </g>
    <circle cx="50" cy="52" r="13" fill="#ff3366"/>
    <rect x="47" y="40" width="6" height="5" fill="#ffee55"/>
    <circle cx="50" cy="52" r="2.5" fill="#fff"/>
    <path d="M26,30 A34,34 0 0 1 50,18" stroke="#666" stroke-width="2" fill="none"/>
  </g>
  <!-- floating notes -->
  <style>.n1{fill:#33dd66}.n2{fill:#ff99dd}@media (prefers-color-scheme: light){.n1{fill:#1a9e1a}.n2{fill:#e0409a}}</style>
  <g font-family="sans-serif" font-size="18">
    <text class="n1" x="88" y="40">♪<animate attributeName="y" values="44;20;44" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></text>
    <text class="n2" x="94" y="70">♫<animate attributeName="y" values="74;46;74" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/></text>
  </g>
</svg>
