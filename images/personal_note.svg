<svg fill="none" viewBox="0 0 600 44" width="600" height="44" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .wrap { position: relative; width: 600px; height: 44px; }
        .line {
          position: absolute; left: 0; top: 0; width: 600px;
          font-family: "Comic Sans MS", "Comic Sans", Chalkboard, ChalkboardSE-Regular, "Marker Felt", Purisa, cursive, sans-serif;
          color: limegreen; font-size: 26px; font-weight: bold; line-height: 44px;
          text-align: center; white-space: nowrap;
          opacity: 0; animation: cycle 6s steps(1, end) infinite;
        }
        .l0 { animation-delay: 0s; } .l1 { animation-delay: 2s; } .l2 { animation-delay: 4s; }
        @media (prefers-color-scheme: light) { .line { color: #1a9e1a; } }
        @keyframes cycle { 0% { opacity: 1; } 33.33% { opacity: 0; } 100% { opacity: 0; } }
        .blink { font-style: normal; animation: blink 1s steps(2, start) infinite; }
        @keyframes blink { to { visibility: hidden; } }
      </style>
      <div class="wrap"><div class="line l0">These days I'm into <span style="color:#ff9900">Java</span><i class="blink">_</i></div><div class="line l1">These days I'm into <span style="color:#00aaff">Python</span><i class="blink">_</i></div><div class="line l2">These days I'm into <span style="color:#ff66cc">Swift</span><i class="blink">_</i></div></div>
    </div>
  </foreignObject>
</svg>
