<svg viewBox="0 0 640 50" width="640" height="50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .t { fill: #e07a1f; }
    .ray { stroke: #f5a623; }
    .core { fill: #ffcf33; }
    @media (prefers-color-scheme: dark) { .t { fill: #ffb347; } }
  </style>
  <defs>
    <g id="sun">
      <g class="ray" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-15" x2="0" y2="-11"/><line x1="0" y1="11" x2="0" y2="15"/>
        <line x1="-15" y1="0" x2="-11" y2="0"/><line x1="11" y1="0" x2="15" y2="0"/>
        <line x1="-10.6" y1="-10.6" x2="-7.8" y2="-7.8"/><line x1="7.8" y1="7.8" x2="10.6" y2="10.6"/>
        <line x1="-10.6" y1="10.6" x2="-7.8" y2="7.8"/><line x1="7.8" y1="-7.8" x2="10.6" y2="-10.6"/>
      </g>
      <circle r="8" class="core"/>
    </g>
  </defs>
  <g transform="translate(28 25)">
    <use href="#sun"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></use>
  </g>
  <text x="320" y="33" text-anchor="middle" textLength="520" lengthAdjust="spacingAndGlyphs"
        font-family="'Comic Sans MS','Comic Sans',Chalkboard,'Marker Felt',cursive" font-size="26" font-weight="bold" class="t">Thanks for stopping by, keep in touch!</text>
  <g transform="translate(612 25)">
    <use href="#sun"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="8s" repeatCount="indefinite"/></use>
  </g>
</svg>
